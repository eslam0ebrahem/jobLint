name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Compile
        run: npm run compile
      - name: Lint
        run: npm run lint
      - name: Unit and browser-fixture tests
        run: npm test
      - name: Verify fixture classifications
        run: npm run verify:fixtures
      - name: Publish fixture contract summary
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- joblint-fixture-contract -->';
            const body = `${marker}\n${fs.readFileSync(process.env.GITHUB_STEP_SUMMARY, 'utf8')}`;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Build Chrome extension
        run: npm run build
      - name: Build Firefox extension
        run: npm run build:firefox

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run extension end-to-end flow
        run: npm run test:e2e
      - name: Run Firefox artifact compatibility smoke
        run: npm run test:e2e:firefox
      - name: Run fixture inspector snapshots
        run: npm run test:visual
