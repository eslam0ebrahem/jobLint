<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="45" y1="45" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="20" y="20" width="88" height="88" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#06B6D4" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" />

  <!-- Briefcase Handle -->
  <rect x="49" y="32" width="30" height="14" rx="6" stroke="#F1F5F9" stroke-width="4.5" fill="none" />

  <!-- Briefcase Body -->
  <rect x="28" y="42" width="72" height="52" rx="10" fill="#F8FAFC" fill-opacity="0.95" />
  
  <!-- Briefcase Flap Line -->
  <path d="M28 56C42 63 86 63 100 56" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />

  <!-- Checkmark / Clip -->
  <g filter="url(#glow)">
    <path d="M47 67L58 78L83 50" stroke="url(#checkGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
